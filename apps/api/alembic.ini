# Alembic configuration. The database URL is intentionally NOT set here — it is read from
# app settings (HOLOFY_DATABASE_URL) in migrations/env.py so migrations target the same
# EU-region Postgres the app does, and secrets never live in a committed file.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped, slugged revision filenames so history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
